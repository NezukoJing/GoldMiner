let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='sine',vol=.12,f2=null,delay=0){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);}
function noise(d,vol=.3,lp=800){if(muted)return;const a=ac();if(!a)return;const len=Math.floor(a.sampleRate*d);const b=a.createBuffer(1,len,a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start();}

const stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d'),ov=$('#ov');
let SCALE=1,BG=null;
function resize(){
  SCALE=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform=`translate(${(innerWidth-W*SCALE)/2}px,${(innerHeight-H*SCALE)/2}px) scale(${SCALE})`;
  const k=SCALE*(window.devicePixelRatio||1);
  cv.width=Math.round(W*k);cv.height=Math.round(H*k);
  ctx.setTransform(k,0,0,k,0,0);
  BG=buildBG(k);
}
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
/* ---- 种子随机流：只用于矿区生成，保证相同种子 → 相同矿区 ----
   玩法中的 AI/粒子/音效等运行时随机仍走 Math.random，不污染种子序列 */
let SEED_STR='',SR=Math.random;
function hashSeed(str){
  if(!str)return(Math.random()*2147483646|0)+1;
  let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return(h>>>0)%2147483646+1;
}
function setSeedForRound(seedStr,round){SR=seeded(((hashSeed(seedStr)^Math.imul(round+1,0x9E3779B1))>>>0)%2147483646+1);}
const srnd=(a,b)=>a+SR()*(b-a);
const sri=(a,b)=>Math.floor(srnd(a,b+1));
function buildBG(k){
  const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);
  const g=c.getContext('2d');g.scale(k,k);const R=seeded(20261123);
  let sg=g.createLinearGradient(0,TOPBAR,0,GROUND);sg.addColorStop(0,'#8fd3ff');sg.addColorStop(1,'#fff0c2');
  g.fillStyle=sg;g.fillRect(0,0,W,GROUND);
  g.fillStyle='rgba(255,236,150,.9)';circle(g,1180,80,26);g.fill();
  g.fillStyle='rgba(255,236,150,.35)';circle(g,1180,80,40);g.fill();
  g.fillStyle='rgba(255,255,255,.85)';
  [[150,70],[520,62],[880,78]].forEach(([x,y])=>{circle(g,x,y,14);g.fill();circle(g,x+16,y-6,17);g.fill();circle(g,x+34,y,13);g.fill();g.fillRect(x,y,34,12);});
  g.fillStyle='#b9dc8a';g.beginPath();g.moveTo(0,GROUND);
  for(let x=0;x<=W;x+=40)g.lineTo(x,GROUND-14-Math.sin(x/130)*9-Math.sin(x/57)*4);
  g.lineTo(W,GROUND);g.closePath();g.fill();
  let dg=g.createLinearGradient(0,GROUND,0,H);
  dg.addColorStop(0,'#dba365');dg.addColorStop(.35,'#c3874d');dg.addColorStop(.7,'#a56c3a');dg.addColorStop(1,'#7c4e28');
  g.fillStyle=dg;g.fillRect(0,GROUND,W,H-GROUND);
  for(let i=0;i<4;i++){const y0=GROUND+110+i*140;g.fillStyle=i%2?'rgba(90,50,15,.08)':'rgba(255,230,180,.07)';g.beginPath();g.moveTo(0,y0);
    for(let x=0;x<=W;x+=32)g.lineTo(x,y0+Math.sin(x/90+i)*8);for(let x=W;x>=0;x-=32)g.lineTo(x,y0+34+Math.sin(x/70+i*2)*8);g.closePath();g.fill();}
  for(let i=0;i<1100;i++){const x=R()*W,y=GROUND+10+R()*(H-GROUND);g.fillStyle=R()<.5?'rgba(80,45,15,.18)':'rgba(255,235,200,.14)';g.fillRect(x,y,1.5+R()*2,1.5+R()*2);}
  for(let i=0;i<40;i++){const x=R()*W,y=GROUND+30+R()*(H-GROUND-30);g.fillStyle='rgba(110,70,35,.28)';g.beginPath();g.ellipse(x,y,3+R()*5,2+R()*3,R()*3,0,7);g.fill();}
  g.fillStyle='#8a5a2b';g.fillRect(0,GROUND-3,W,9);
  g.fillStyle='#6fb54a';g.fillRect(0,GROUND-6,W,5);
  g.fillStyle='#e8c27a';g.fillRect(0,GROUND+6,W,2);
  return c;
}

  for(let i=0;i<12;i++){const a=rnd(0,6.28),s=rnd(60,220);G.parts.push({x:o.x,y:o.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rnd(.4,.8),t:0,c,sz:rnd(2,4),g:600});}}
function sparkle(x,y,n){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(40,160);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:rnd(.4,.8),t:0,c:Math.random()<.5?'#fff3a0':'#ffd23f',sz:rnd(1.5,3.5),g:200,star:1});}}
function addFloat(x,y,text,c,size){G.floats.push({x,y,text,c,size,t:0,dur:1.3});}
function updateFx(dt){
  G.fx=G.fx.filter(f=>(f.t+=dt)<f.dur);
  G.parts=G.parts.filter(q=>{q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;return q.t<q.life;});
  G.floats=G.floats.filter(f=>{f.t+=dt;f.y-=36*dt;return f.t<f.dur;});
  if(G.shake>0)G.shake-=dt;if(G.goFlash>0)G.goFlash-=dt;
  if(G.banner){G.banner.t+=dt;}
}
function updateSticks(dt){
  G.sticks=G.sticks.filter(s=>{
    s.t+=dt;
    if(s.t>=s.dur){
      s.p.stickFlying=false;
      if(!s.item.gone&&G.items.includes(s.item)){s.item.gone=true;debris(s.item);G.fx.push({x:s.item.x,y:s.item.y,R:45,t:0,dur:.35});if(!G.demo)SFX.small();
        if(s.p.hook.item===s.item)s.p.hook.item=null;}
      return false;
    }
    return true;
  });
}

function blob(c,shape,r){const n=shape.length;c.beginPath();for(let i=0;i<=n;i++){const a=shape[i%n],b=shape[(i+1)%n];const mx=(a[0]+b[0])/2*r,my=(a[1]+b[1])/2*r;if(i===0)c.moveTo(mx,my);else c.quadraticCurveTo(a[0]*r,a[1]*r,mx,my);}c.closePath();}
function poly(c,shape,r){c.beginPath();shape.forEach(([a,b],i)=>i?c.lineTo(a*r,b*r):c.moveTo(a*r,b*r));c.closePath();}
function drawDiamondShape(c,r){const pts=[[-1,-.25],[-.55,-.8],[.55,-.8],[1,-.25],[0,1.05]];
  c.beginPath();pts.forEach(([a,b],i)=>i?c.lineTo(a*r,b*r):c.moveTo(a*r,b*r));c.closePath();
  const g=c.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#ffffff');g.addColorStop(.4,'#a8eeff');g.addColorStop(1,'#2fa4ec');
  c.fillStyle=g;c.fill();c.strokeStyle='#1f78b8';c.lineWidth=1.5;c.stroke();
  c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1;c.beginPath();
  c.moveTo(-r,-.25*r);c.lineTo(r,-.25*r);c.moveTo(-.55*r,-.8*r);c.lineTo(-.25*r,-.25*r);c.lineTo(0,1.05*r);c.moveTo(.55*r,-.8*r);c.lineTo(.25*r,-.25*r);c.lineTo(0,1.05*r);c.stroke();}
function star(c,x,y,s){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,q=i%2?s*.3:s;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}c.closePath();c.fill();}
function drawItemSprite(c,it,im,mul){
  const r=it.r;c.save();c.translate(it.x,it.y);
  const moving=it.t==='mouse'||it.t==='pig';
  /* mouse(老鼠)贴图头朝左、mouse_dia(钻石猪)贴图头朝右：按各自贴图翻转，让头始终朝向行进方向 */
  if(moving){const f=it.t==='pig'?(it.vx>0?1:-1):(it.vx>0?-1:1);c.scale(f,1);if(!it.taken)c.translate(0,Math.abs(Math.sin(G.time*12+it.ph))*-2);}
  else{if(it.t.startsWith('gold')||it.t.startsWith('rock'))c.rotate(it.rot*.5);if(it.mir)c.scale(-1,1);}
  c.fillStyle='rgba(50,25,5,.22)';c.beginPath();c.ellipse(2,r*.95,r*.95,r*.22,0,0,7);c.fill();
  if(it.t==='tnt'&&it.fuse>0&&Math.sin(G.time*60)>0)c.globalAlpha=.45;
  drawSprite(c,im,r*mul);c.globalAlpha=1;
  if(it.t==='diamond'){const s=(Math.sin(G.time*3+it.ph)+1)/2;if(s>.55){c.fillStyle=`rgba(255,255,255,${(s-.55)*2.2})`;star(c,r*.45,-r*.75,7*s);}}
  c.restore();
}
/* 商店商品：用 drawIcon 的画法预渲染到缓存 canvas，再贴到柜台/钩爪上 */
const SHOP_ICON_CACHE={};
function shopIconCanvas(type){
  if(SHOP_ICON_CACHE[type])return SHOP_ICON_CACHE[type];
  const cv=document.createElement('canvas');cv.width=144;cv.height=144;cv.dataset.icon=type;/*SHOP_ICON_FIX*/
  try{drawIcon(cv);}catch(e){}
  return SHOP_ICON_CACHE[type]=cv;
}
function drawShopItem(c,it){
  const sold=it.offer&&it.offer.soldTo!==null;
  const img=shopIconCanvas(it.t);
  c.save();c.translate(it.x,it.y);
  if(sold)c.globalAlpha=.38;
  if(img)c.drawImage(img,-62,-62,124,124);/*SHOP_ICON_FIX*/
  if(sold){
    c.globalAlpha=1;c.rotate(-.16);
    c.fillStyle='rgba(150,30,20,.92)';rr(c,-44,-13,88,26,6);c.fill();
    c.strokeStyle='#ffd9c0';c.lineWidth=2;c.stroke();
    c.fillStyle='#fff3e0';c.font=`900 19px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText('已售出',0,1);
  }
  c.restore();
}
/* 商店背景：木质店铺墙 + 顶部横梁 + 壁灯 + 柜台，风格贴合参考截图 */

  c.fillStyle='#2b180a';c.fillRect(0,0,W,104);
  c.fillStyle='#7a4e28';c.fillRect(0,96,W,18);
  c.fillStyle='#a8703a';c.fillRect(0,96,W,4);
  c.fillStyle='#3a200e';c.fillRect(0,114,W,6);

    c.fillStyle='#ffcf6b';c.beginPath();c.ellipse(x,150,5,11,0,0,7);c.fill();

function drawItem(c,it){
  if(it.shop)return drawShopItem(c,it);
  const m=ITEM_SPR[it.t],im=m&&spr(m[0]);
  if(im)return drawItemSprite(c,it,im,m[1]);
  const r=it.r;c.save();c.translate(it.x,it.y);
  switch(it.t){
    case 'gold_s':case 'gold_m':case 'gold_l':case 'gold_xl':{
      c.rotate(it.rot);c.save();c.translate(2,4);c.fillStyle='rgba(60,30,0,.25)';blob(c,it.shape,r);c.fill();c.restore();
      const g=c.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r*1.15);g.addColorStop(0,'#fff7c2');g.addColorStop(.35,'#ffd43b');g.addColorStop(.8,'#e09a00');g.addColorStop(1,'#a86800');
      c.fillStyle=g;blob(c,it.shape,r);c.fill();c.lineWidth=2;c.strokeStyle='#8f5a00';c.stroke();
      c.fillStyle='rgba(170,100,0,.35)';circle(c,r*.3,r*.22,r*.12);c.fill();circle(c,-r*.12,r*.42,r*.08);c.fill();
      c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.ellipse(-r*.35,-r*.38,r*.22,r*.12,-.6,0,7);c.fill();
      break;}
    case 'rock_s':case 'rock_l':{
      c.rotate(it.rot);c.save();c.translate(2,4);c.fillStyle='rgba(40,25,10,.28)';poly(c,it.shape,r);c.fill();c.restore();
      const g=c.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r*1.1);g.addColorStop(0,'#e6e2dc');g.addColorStop(.5,'#a49d94');g.addColorStop(1,'#6a635b');
      c.fillStyle=g;poly(c,it.shape,r);c.fill();c.lineWidth=2;c.strokeStyle='#4d4842';c.stroke();
      c.strokeStyle='rgba(60,55,50,.55)';c.lineWidth=1.5;c.beginPath();c.moveTo(-r*.2,-r*.55);c.lineTo(0,-r*.1);c.lineTo(-r*.18,r*.32);c.moveTo(r*.45,r*.05);c.lineTo(r*.15,r*.18);c.stroke();
      c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(-r*.35,-r*.35,r*.2,r*.1,-.6,0,7);c.fill();
      break;}
    case 'diamond':{
      c.rotate(it.rot*.3);c.fillStyle='rgba(0,40,80,.2)';c.beginPath();c.ellipse(2,r*.9,r*.8,r*.25,0,0,7);c.fill();
      drawDiamondShape(c,r);
      const s=(Math.sin(G.time*3+it.ph)+1)/2;if(s>.55){c.fillStyle=`rgba(255,255,255,${(s-.55)*2.2})`;star(c,r*.5,-r*.7,7*s);}
      break;}
    case 'bone':{
      c.rotate(it.rot+.6);c.fillStyle='#f5f0e1';c.strokeStyle='#b9ad90';c.lineWidth=1.5;
      rr(c,-r*.8,-r*.2,r*1.6,r*.4,3);c.fill();c.stroke();
      [[-r*.85,-r*.22],[-r*.85,r*.22],[r*.85,-r*.22],[r*.85,r*.22]].forEach(([x,y])=>{circle(c,x,y,r*.28);c.fill();c.stroke();});
      c.fillStyle='#f5f0e1';c.fillRect(-r*.75,-r*.18,r*1.5,r*.36);
      break;}
    case 'skull':{
      c.fillStyle='#f3eee0';c.strokeStyle='#a99d82';c.lineWidth=1.5;
      rr(c,-r*.5,r*.35,r,r*.55,4);c.fill();c.stroke();circle(c,0,-r*.1,r*.9);c.fill();c.stroke();
      c.fillStyle='#3a2f25';circle(c,-r*.36,-r*.1,r*.24);c.fill();circle(c,r*.36,-r*.1,r*.24);c.fill();
      c.beginPath();c.moveTo(0,r*.15);c.lineTo(-r*.1,r*.35);c.lineTo(r*.1,r*.35);c.closePath();c.fill();
      c.strokeStyle='#8a7f6a';c.lineWidth=1;c.beginPath();for(let i=-1;i<=1;i++){c.moveTo(i*r*.2,r*.5);c.lineTo(i*r*.2,r*.85);}c.stroke();
      break;}
    case 'bag':{
      c.fillStyle='rgba(50,25,5,.25)';c.beginPath();c.ellipse(2,r*.95,r*.9,r*.25,0,0,7);c.fill();
      c.beginPath();c.moveTo(-r*.45,-r*.55);c.quadraticCurveTo(-r*1.15,r*.2,-r*.8,r*.85);c.quadraticCurveTo(0,r*1.15,r*.8,r*.85);c.quadraticCurveTo(r*1.15,r*.2,r*.45,-r*.55);c.closePath();
      const g=c.createLinearGradient(0,-r,0,r);g.addColorStop(0,'#e6b677');g.addColorStop(1,'#a06a33');c.fillStyle=g;c.fill();c.strokeStyle='#6e4419';c.lineWidth=1.5;c.stroke();
      c.fillStyle='#c48c4c';c.beginPath();c.ellipse(0,-r*.68,r*.5,r*.22,0,0,7);c.fill();c.stroke();
      c.strokeStyle='#d7362b';c.lineWidth=2.5;c.beginPath();c.moveTo(-r*.42,-r*.48);c.lineTo(r*.42,-r*.48);c.stroke();
      c.font=`bold ${Math.round(r*1.1)}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.lineWidth=3;c.strokeStyle='#6e4419';c.strokeText('?',0,r*.25);c.fillStyle='#fff6d8';c.fillText('?',0,r*.25);
      break;}
    case 'mouse':{
      const f=it.vx<0?-1:1;c.scale(f,1);const lg=Math.sin(G.time*14+it.ph)*2;
      c.strokeStyle='#8a7f80';c.lineWidth=2;c.beginPath();c.moveTo(-r*1.05,0);c.quadraticCurveTo(-r*1.7,-r*.1,-r*1.9,-r*.6);c.stroke();
      c.fillStyle='#6f6a6b';c.fillRect(-r*.6,r*.5+lg,3,5);c.fillRect(r*.4,r*.5-lg,3,5);
      c.fillStyle='#9b9b9f';c.beginPath();c.ellipse(0,0,r*1.1,r*.72,0,0,7);c.fill();
      circle(c,r*.95,-r*.1,r*.5);c.fill();
      c.fillStyle='#f2a7b5';circle(c,r*.7,-r*.62,r*.3);c.fill();circle(c,r*1.45,-r*.02,r*.12);c.fill();
      c.fillStyle='#222';circle(c,r*1.1,-r*.22,2);c.fill();
      break;}
    case 'pig':{
      const f=it.vx<0?-1:1;c.scale(f,1);const lg=Math.sin(G.time*12+it.ph)*2;
      c.fillStyle='#e48aa0';[-r*.6,-r*.2,r*.25,r*.6].forEach((x,i)=>c.fillRect(x,r*.55+(i%2?lg:-lg),4,6));
      c.fillStyle='#f7aebd';c.strokeStyle='#d27a8e';c.lineWidth=1.5;c.beginPath();c.ellipse(0,0,r*1.15,r*.8,0,0,7);c.fill();c.stroke();
      circle(c,r*.95,-r*.15,r*.58);c.fill();c.stroke();
      c.beginPath();c.moveTo(r*.65,-r*.6);c.lineTo(r*.8,-r*1);c.lineTo(r*1.0,-r*.65);c.closePath();c.fill();c.stroke();
      c.fillStyle='#f28da2';c.beginPath();c.ellipse(r*1.45,-r*.05,r*.24,r*.2,0,0,7);c.fill();
      c.fillStyle='#222';circle(c,r*1.05,-r*.3,2);c.fill();
      c.save();c.translate(r*1.55,r*.38);c.scale(.55,.55);drawDiamondShape(c,r*.75);c.restore();
      break;}
    case 'tnt':{
      const fl=it.fuse>0?(Math.sin(G.time*60)>0?1:0):0;
      c.strokeStyle='#5a3a1a';c.lineWidth=2;c.beginPath();c.moveTo(0,-r);c.quadraticCurveTo(r*.2,-r*1.35,r*.5,-r*1.4);c.stroke();
      c.fillStyle=Math.sin(G.time*20+it.ph)>0?'#ffd23f':'#ff7a1f';circle(c,r*.52,-r*1.42,3);c.fill();
      const g=c.createLinearGradient(-r,0,r,0);g.addColorStop(0,'#c92a1f');g.addColorStop(.45,'#ff6b5a');g.addColorStop(1,'#a8211a');
      c.fillStyle=fl?'#fff':g;rr(c,-r*.8,-r,r*1.6,r*2,5);c.fill();c.strokeStyle='#6a140e';c.lineWidth=1.5;c.stroke();
      c.fillStyle='#7a1a12';c.fillRect(-r*.8,-r*.7,r*1.6,3);c.fillRect(-r*.8,r*.6,r*1.6,3);
      c.font=`bold ${Math.round(r*.62)}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText('TNT',0,0);
      break;}
  }
  c.restore();
}

/* ================= 绘制：矿工、钩子 ================= */
function drawRope(c,p){const t=tipOf(p);c.strokeStyle='#3d2b1a';c.lineWidth=2;c.beginPath();c.moveTo(p.x,p.py);c.lineTo(t.x,t.y);c.stroke();}
function drawClaw(c,p){
  const h=p.hook,t=tipOf(p);c.save();c.translate(t.x,t.y);c.rotate(-h.ang);
  const ci=spr('claw');
  if(ci){
    const k=CLAW_ART.w/ci.naturalWidth,w=ci.naturalWidth*k,hh=ci.naturalHeight*k;
    c.translate(0,CLAW_ART.stemAt);c.rotate(CLAW_ART.tilt);
    if(h.burnt>0)c.filter='brightness(.3)';
    c.drawImage(ci,-CLAW_ART.stemX*w,-CLAW_ART.stemY*hh,w,hh);c.filter='none';
    c.restore();return;
  }
  const open=h.item?.25:(h.state==='extend'?.85:.6);
  c.strokeStyle=h.burnt>0?'#222':'#555b63';c.lineWidth=4;c.lineCap='round';
  for(const s of[-1,1]){c.beginPath();c.moveTo(0,-6);c.quadraticCurveTo(s*(8+8*open),0,s*(4+7*open),12);c.lineTo(s*(1+2*open),14);c.stroke();}
  c.fillStyle=h.burnt>0?'#333':'#868d96';circle(c,0,-7,5);c.fill();c.strokeStyle='#40454c';c.lineWidth=1.5;c.stroke();
  c.restore();
}
function drawMiner(c,p){
  const x=p.x,y=GROUND,tm=TEAM[p.team];
  const mi=spr('miner');
  if(mi){
    const A=MINER_ART,k=A.h/mi.naturalHeight,w=mi.naturalWidth*k,hh=A.h;
    const pulling=p.hook.state==='retract'&&p.hook.item,bob=pulling?Math.sin(G.time*16)*1.2:0;
    /* 队伍标识：脚下彩色光圈 */
    c.save();c.fillStyle=tm.c;c.globalAlpha=.45;c.beginPath();c.ellipse(x-A.reelX*w+w/2,y+3,w*.55,7,0,0,7);c.fill();c.restore();
    /* 绞盘底部对齐钩子支点 */
    const top=p.py-A.reelBottom*hh+2;
    c.drawImage(mi,x-A.reelX*w,top+bob,w,hh);
    return;
  }
  c.save();
  c.fillStyle='#8a5a2b';c.strokeStyle='#4e2e12';c.lineWidth=1.5;rr(c,x-30,y-6,82,8,3);c.fill();c.stroke();
  c.strokeStyle='#6b3f1a';c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(x-15,y-4);c.lineTo(x,y-22);c.lineTo(x+15,y-4);c.stroke();
  c.fillStyle='#b07a3e';circle(c,x,y-22,10);c.fill();c.strokeStyle='#5a3414';c.lineWidth=1.5;c.stroke();
  c.fillStyle='#e0cc9c';circle(c,x,y-22,5.5);c.fill();
  c.strokeStyle='#5a3414';c.lineWidth=1.5;c.beginPath();for(let i=0;i<3;i++){const a=p.reel+i*2.094;c.moveTo(x,y-22);c.lineTo(x+Math.cos(a)*9,y-22+Math.sin(a)*9);}c.stroke();
  const mx=x+34,pulling=p.hook.state==='retract'&&p.hook.item,bob=pulling?Math.sin(G.time*14)*1.5:0;
  const hx=x+Math.cos(p.reel)*9,hy=y-22+Math.sin(p.reel)*9;
  c.fillStyle='#3b2a1e';c.fillRect(mx-7,y-16,5,13);c.fillRect(mx+2,y-16,5,13);
  c.fillStyle='#2a1d14';c.fillRect(mx-8,y-5,7,3);c.fillRect(mx+1,y-5,7,3);
  c.fillStyle=tm.c;rr(c,mx-10,y-40+bob,20,26,6);c.fill();c.strokeStyle=tm.dark;c.lineWidth=1.5;c.stroke();
  c.fillStyle='rgba(255,255,255,.3)';c.fillRect(mx-6,y-38+bob,3,14);
  c.strokeStyle='#f0c08e';c.lineWidth=4;c.beginPath();c.moveTo(mx-8,y-32+bob);c.lineTo(hx,hy);c.stroke();
  c.fillStyle='#f5c99a';circle(c,mx,y-48+bob,10);c.fill();
  c.fillStyle='#8b5a2b';c.beginPath();c.arc(mx,y-46+bob,10,.15*Math.PI,.85*Math.PI);c.lineTo(mx-6,y-40+bob);c.quadraticCurveTo(mx,y-34+bob,mx+6,y-40+bob);c.fill();
  c.fillStyle='#222';circle(c,mx-4,y-50+bob,1.6);c.fill();
  c.fillStyle='#e9a77a';circle(c,mx-8,y-47+bob,2.5);c.fill();
  c.fillStyle=tm.c;c.beginPath();c.arc(mx,y-51+bob,11,Math.PI,0);c.fill();c.strokeStyle=tm.dark;c.stroke();
  c.fillStyle=tm.dark;c.fillRect(mx-13,y-52+bob,26,3);
  c.fillStyle='#ffe066';circle(c,mx-3,y-58+bob,3.2);c.fill();
  c.restore();
}
function miniDyn(c,x,y){c.save();c.translate(x,y);c.rotate(-.35);c.fillStyle='#d9362b';rr(c,-3,-7,6,14,2);c.fill();c.strokeStyle='#5a2a10';c.lineWidth=1.2;c.beginPath();c.moveTo(0,-7);c.quadraticCurveTo(2,-10,4,-11);c.stroke();c.restore();}
function drawLabel(c,p){
  const w=180,h=38,x=p.x-w/2,y=48,tm=TEAM[p.team];

  c.textAlign='right';c.font=`bold 15px ${FONT}`;c.fillStyle='#8f5a00';c.fillText(fmt(p.cur),x+w-9,y+12);

function drawHUD(c){
  c.save();c.fillStyle='rgba(58,34,14,.92)';c.fillRect(0,0,W,TOPBAR);c.fillStyle='#e0a53c';c.fillRect(0,TOPBAR-2,W,2);
  const s=teamSums();c.textBaseline='middle';
  const hudScores=shownScores();/*SCORE_MODE*/
  [0,1].forEach(t=>{const tm=TEAM[t],L=t===0;const bx=L?30:W-30;
    c.fillStyle=tm.c;circle(c,bx,22,17);c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();
    c.fillStyle='#fff';c.font=`bold ${isTotal()&&hudScores[t]>=10000?15:20}px ${FONT}`;c.textAlign='center';c.fillText(isTotal()?fmt(hudScores[t]):hudScores[t],bx,23);/*SCORE_MODE*/
    c.textAlign=L?'left':'right';const tx=L?56:W-56;
    c.font=`bold 15px ${FONT}`;c.fillStyle=t?'#bcd4ff':'#ffc2c2';c.fillText(tm.name,tx,14);
    c.font=`bold 17px ${FONT}`;c.fillStyle='#fff3c4';c.fillText('本轮 '+fmt(s[t]),tx,32);});
  const tot=s[0]+s[1],bw=300,bx=170,bx2=W-170-bw;
  const share=tot>0?s[0]/tot:.5;
  c.fillStyle='rgba(255,255,255,.15)';rr(c,bx,17,bw,10,5);c.fill();rr(c,bx2,17,bw,10,5);c.fill();
  c.fillStyle=TEAM[0].c;rr(c,bx,17,Math.max(4,bw*share),10,5);c.fill();
  c.fillStyle=TEAM[1].c;const wb=Math.max(4,bw*(1-share));rr(c,bx2+bw-wb,17,wb,10,5);c.fill();
  c.textAlign='right';c.font=`bold 15px ${FONT}`;c.fillStyle='#ffe7a8';c.fillText(`第 ${G.round} / ${G.cfg.rounds} 轮`,W/2-58,22);
  const low=G.timeLeft<=10&&G.phase==='play';const pulse=low?(Math.sin(G.time*10)+1)/2:0;
  c.fillStyle=low?`rgb(${200+pulse*55},${60},${50})`:'#fff3d0';rr(c,W/2-44,6,88,32,10);c.fill();

/* ---------------- fx 事件 → 本地表现 ---------------- */
function playFx(list) {

    else if (e.t === 'boom') addBoom(e.x, e.y, e.R);
    else if (e.t === 'debris') debris({ x: e.x, y: e.y, t: e.it });
    else if (e.t === 'sparkle') sparkle(e.x, e.y, e.n);
    else if (e.t === 'float') addFloat(e.x, e.y, e.text, e.c, e.size);
  }

/* ---------------- 快照 → 本地 G（含插值） ---------------- */
function lerpSnap(a, b, alpha) {
  if (!a || a === b) return b;
  const out = Object.assign({}, b);
  // 物品按 id 插值
  const am = new Map(a.items.map(it => [it.id, it]));
  out.items = b.items.map(it => {
    const o = am.get(it.id);
    if (!o) return it;
    return Object.assign({}, it, { x: o.x + (it.x - o.x) * alpha, y: o.y + (it.y - o.y) * alpha });
  });
  // 玩家钩子角度/长度插值（±75°，不跨 180°，直接线性安全）
  const ap = a.players || [];
  out.players = b.players.map((p, i) => {
    const o = ap[i];
    if (!o || o.idx !== p.idx) return p;
    return Object.assign({}, p, {
      hook: Object.assign({}, p.hook, {
        ang: o.hook.ang + (p.hook.ang - o.hook.ang) * alpha,
        len: o.hook.len + (p.hook.len - o.hook.len) * alpha

    });
  });

  G.seedId = s.seedId; G.timeLeft = s.timeLeft; G.countdown = s.countdown;
  G.points = s.points; G.history = s.history; G.clearEarly = s.clearEarly;
  G.matchWinner = s.matchWinner; G.shake = s.shake; G.goFlash = s.goFlash;
  G.banner = s.banner; G.time = s.time; G.shop = s.shop; G.demo = false;

  G.items = s.items.map(it => Object.assign({}, it));

    const keys = (KEYS[s.mode] || KEYS1)[p.idx] || KEYS1[0];
    return Object.assign({}, p, {

      })
    });
  });
  G.sticks = (s.sticks || []).map(st => {
    const p = G.players.find(x => x.idx === st.pIdx);
    const item = byId.get(st.itemId);
    return (p && item) ? { p, item, t: st.t, dur: st.dur, x0: st.x0, y0: st.y0 } : null;
  }).filter(Boolean);
  syncUI(s);
}

/* ---------------- UI 状态机 ---------------- */
let shopHudTick = null;
function syncUI(s) {
  if (s.phase !== lastUIPhase) {
    lastUIPhase = s.phase;
    if (['countdown', 'play', 'roundEnd'].includes(s.phase)) hideOv();
    if (s.phase === 'result') renderResultUI();
    else if (s.phase === 'shop') { renderShopUI(); startShopHudTick(); }
    else if (s.phase === 'final') { if (shopHudTick) { clearInterval(shopHudTick); shopHudTick = null; } renderFinalUI(); }
    else if (shopHudTick) { clearInterval(shopHudTick); shopHudTick = null; }
  }
}
function startShopHudTick() {
  if (shopHudTick) clearInterval(shopHudTick);
  shopHudTick = setInterval(() => {
    if (!currSnap || currSnap.phase !== 'shop' || !currSnap.shop) { clearInterval(shopHudTick); shopHudTick = null; return; }
    const sh = currSnap.shop, done = !!sh.done || sh.timeLeft <= 0 || sh.offers.every(o => o.soldTo !== null);
    const t = $('#shTimer'); if (t) t.textContent = Math.max(0, Math.ceil(sh.timeLeft));
    (currSnap.players || []).forEach((p, i) => { const el = $('#shlog' + i); if (el && sh.log[i]) el.textContent = sh.log[i]; });
    const me = currSnap.players[NET.seat];
    const w = $('#shWalletVal'); if (w && me) w.textContent = fmt(me.wallet);
    if (done) {
      const ov = $('#shOver'); if (ov) ov.style.display = 'block';
      const b = $('#shEnd');
      if (b && b.textContent !== '即将进入下一轮…') { b.textContent = '即将进入下一轮…'; b.classList.remove('ready'); b.disabled = true; b.style.opacity = '.6'; b.style.cursor = 'default'; }
    }
  }, 120);
}
function toast(text) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = text; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function netBar() {
  const copyBtn = NET.room ? ` <button type="button" onclick="copyInvite()" title="复制邀请链接" style="margin-left:8px;padding:2px 9px;font-size:12px;cursor:pointer;border:1px solid #e0a53c;border-radius:8px;background:#fff8e8;color:#a4630a">⧉ 复制邀请</button>` : '';
  return `<div class="netbar">房间 <b id="roomCode">${NET.room || '----'}</b>${copyBtn} · 座位 <b>${NET.seat >= 0 ? 'P' + (NET.seat + 1) : '--'}</b>${NET.isHost ? ' · 房主' : ''}</div>`;
}
/* 生成并复制邀请文案：Anyone 打开链接即可输入房间号加入 */
function copyInvite() {
  const code = NET.room || '----', host = NET.hostName || '房主';
  const text = `${host}在${INVITE_URL}建立了一个黄金矿工对抗版的房间，打开网页，输入房间号${code}加入他的房间吧！`;
  const done = () => toast('✓ 邀请文案已复制，发给好友吧');
  const fail = () => toast('复制失败，请手动选择文本');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done, fail));
    } else fallbackCopy(text, done, fail);
  } catch (e) { fallbackCopy(text, done, fail); }
}
function fallbackCopy(text, done, fail) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    ok ? done() : fail();
  } catch (e) { fail(); }
}

function renderFinalUI() {

  const pts = s.points, tot = [0, 0];
  s.players.forEach(p => tot[p.team] += (p.roundValues || []).reduce((a, b) => a + b, 0));
  let w = s.matchWinner;
  const n = s.history.length;
  let head = '<tr><th>选手</th>'; for (let i = 0; i < n; i++) head += `<th>R${i + 1}</th>`; head += '<th>合计</th></tr>';
  let body = '';
  [0, 1].forEach(t => {
    s.players.filter(p => p.team === t).forEach(p => {
      body += `<tr><td style="color:${TEAM[t].c};font-weight:bold">${esc(p.name)}</td>${(p.roundValues || []).map(v => `<td>${fmt(v)}</td>`).join('')}<td><b>${fmt((p.roundValues || []).reduce((a, b) => a + b, 0))}</b></td></tr>`;
    });
    body += `<tr class="tt${t}"><td>${TEAM[t].name}合计</td>${s.history.map(h => `<td class="${h.winner === t ? 'wc' : ''}">${fmt(h.sums[t])}</td>`).join('')}<td>${fmt(tot[t])}</td></tr>`;
  });
  const banner = w < 0 ? '<div class="banner" style="color:#8a6a45">平局！</div>'
    : `<div class="banner" style="color:${TEAM[w].c}">${TEAM[w].name} 获胜！</div>`;
  let bar = NET.isHost
    ? `<div class="btns"><button class="primary" id="fAgain">再来一局</button><button class="btn" id="fBack">返回大厅</button></div>`
    : `<div class="center dim">等待房主操作…</div>`;
  const fs = isTotal() ? [fmt(tot[0]), fmt(tot[1])] : [pts[0], pts[1]];
  const modeTag = `<div class="dim" style="font-size:13px">计分模式：${isTotal() ? '总分模式（全场物资总价值直接比较）' : '回合模式（每轮胜方 +1 分）'}</div>`;
  showOv(`<div class="panel final" style="width:640px">${banner}
    <div class="score"><span style="color:${TEAM[0].c}">红队</span><b style="color:${TEAM[0].c}">${fs[0]}</b>:<b style="color:${TEAM[1].c}">${fs[1]}</b><span style="color:${TEAM[1].c}">蓝队</span>
    ${modeTag}
    ${!isTotal() && w >= 0 && pts[0] === pts[1] ? `<div class="dim" style="font-size:13px">比分持平，按全场物资总价值判定</div>` : ''}</div>

  </div>`);
  if ($('#fAgain')) $('#fAgain').onclick = () => flow(PROTO.FLOW.AGAIN);
  if ($('#fBack')) $('#fBack').onclick = () => flow(PROTO.FLOW.BACK);
}

/* ---------------- 输入 ---------------- */
addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (e.code === 'KeyM' && tag !== 'INPUT') { toggleMute(); return; }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code) && tag !== 'INPUT') e.preventDefault();
  if (e.repeat || !NET.started || (G.phase !== 'play' && G.phase !== 'shop')) return;
  const keys = (KEYS[G.cfg.mode] || KEYS1)[NET.seat];
  if (!keys) return;
  if (e.code === keys.fire) input('fire');
  else if (e.code === keys.bomb) input('bomb');
  if ((e.code === 'Enter' || e.code === 'NumpadEnter') && ov.classList.contains('show') && tag !== 'SELECT') {
    const b = ov.querySelector('.primary'); if (b) { e.preventDefault(); b.click(); }
  }
});

/* ---------------- 主循环（插值渲染） ---------------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  updateFx(dt); // 本地粒子/飘字/震动
  if (currSnap) {
    const renderAt = ts - PROTO.INTERP_DELAY_MS;
    const span = currAt - prevAt;
    const alpha = span > 0 && prevSnap ? clamp((renderAt - prevAt) / span, 0, 1) : 1;
    hydrate(lerpSnap(prevSnap, currSnap, alpha));
  }
  render();
  requestAnimationFrame(frame);
}

/* ---------------- 启动 ---------------- */
resize();
addEventListener('resize', resize);
connect();
renderLobby();
requestAnimationFrame(frame);

</script>
