# Render Blueprint —— 黄金矿工对抗赛 · 联机版
# 用法：把本 deploy 目录的全部内容作为 GitHub 仓库的"根目录"上传，
#       在 Render 新建 Blueprint 时选中该仓库，它会自动读取这个文件。

services:
  - type: web                 # 必须是 web（长运行服务），不能用 static —— 静态站点不支持 WebSocket
    name: gold-miner-online
    runtime: node
    plan: free                # 免费档空闲约 15 分钟会休眠；要常驻在线可改成 starter（付费）
    region: singapore         # 离中国大陆较近，延迟低；也可改 oregon / frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # PORT 不用手动配：Render 会自动注入 PORT，server.js 里读的就是 process.env.PORT
